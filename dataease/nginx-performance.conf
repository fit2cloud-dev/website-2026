# ============================================================
# DataEase 官网 —— Nginx 性能配置片段
# 用法：将以下内容放入 server{} 块，或 include 进对应 server
# ============================================================

# ---------- 1. 压缩 ----------
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    text/html text/plain text/css text/xml
    application/javascript application/x-javascript application/json
    application/xml application/rss+xml
    image/svg+xml font/ttf font/eot font/otf;

# Brotli（需 ngx_brotli 模块，编译时加入；未安装可整段注释）
# brotli on;
# brotli_comp_level 6;
# brotli_types
#     text/html text/plain text/css text/xml
#     application/javascript application/x-javascript application/json
#     image/svg+xml;

# ---------- 2. 缓存策略 ----------
# HTML：禁用强缓存，始终协商校验
location ~* \.html$ {
    add_header Cache-Control "public, no-cache";
}

# CSS / JS：一周（本站资源无内容指纹，不宜设一年）
location ~* \.(?:css|js)$ {
    add_header Cache-Control "public, max-age=604800";
    access_log off;
}

# 图片 / 字体：一年（内容基本不变）
location ~* \.(?:webp|jpg|jpeg|png|gif|svg|ico|woff2?|ttf|eot)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}

# PDF 下载
location ~* \.pdf$ {
    add_header Cache-Control "public, max-age=2592000";
}

# ---------- 3. WebP 协商（可选，需先生成同名 .webp） ----------
