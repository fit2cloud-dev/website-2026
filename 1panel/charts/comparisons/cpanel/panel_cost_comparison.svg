<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title description">
  <title id="title">1Panel vs cPanel 总拥有成本对比</title>
  <desc id="description">1Panel 五年软件许可成本为零，cPanel Admin 累计成本从第一年的 396 美元增长至第五年的 1979 美元。</desc>

  <rect width="1440" height="820" rx="24" fill="#ffffff"/>
  <text x="720" y="54" text-anchor="middle" fill="#0f172a" font-family="Inter, 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="700">
    1Panel vs cPanel 总拥有成本对比
  </text>

  <g font-family="Inter, 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" fill="#334155">
    <line x1="156" y1="91" x2="202" y2="91" style="stroke:#005eeb;stroke-width:5;stroke-linecap:round"/>
    <circle cx="179" cy="91" r="7" fill="#005eeb"/>
    <text x="216" y="98">1Panel (开源免费)</text>

    <line x1="430" y1="91" x2="476" y2="91" style="stroke:#f9734f;stroke-width:5;stroke-linecap:round"/>
    <circle cx="453" cy="91" r="7" fill="#f9734f"/>
    <text x="490" y="98">cPanel Admin许可</text>
  </g>

  <rect x="130" y="124" width="1230" height="566" rx="16" fill="#ffffff" style="stroke:#dbeafe;stroke-width:2"/>

  <g style="stroke:#e8eef7;stroke-width:1.5">
    <line x1="130" y1="157" x2="1360" y2="157"/>
    <line x1="130" y1="223" x2="1360" y2="223"/>
    <line x1="130" y1="290" x2="1360" y2="290"/>
    <line x1="130" y1="357" x2="1360" y2="357"/>
    <line x1="130" y1="423" x2="1360" y2="423"/>
    <line x1="130" y1="490" x2="1360" y2="490"/>
    <line x1="130" y1="557" x2="1360" y2="557"/>
    <line x1="130" y1="623" x2="1360" y2="623"/>
    <line x1="130" y1="690" x2="1360" y2="690"/>

    <line x1="210" y1="124" x2="210" y2="690"/>
    <line x1="570" y1="124" x2="570" y2="690"/>
    <line x1="930" y1="124" x2="930" y2="690"/>
    <line x1="1290" y1="124" x2="1290" y2="690"/>
  </g>

  <g fill="#64748b" font-family="Inter, 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17">
    <text x="112" y="696" text-anchor="end">0</text>
    <text x="112" y="629" text-anchor="end">250</text>
    <text x="112" y="563" text-anchor="end">500</text>
    <text x="112" y="496" text-anchor="end">750</text>
    <text x="112" y="429" text-anchor="end">1000</text>
    <text x="112" y="363" text-anchor="end">1250</text>
    <text x="112" y="296" text-anchor="end">1500</text>
    <text x="112" y="229" text-anchor="end">1750</text>
    <text x="112" y="163" text-anchor="end">2000</text>

    <text x="210" y="725" text-anchor="middle">第1年</text>
    <text x="570" y="725" text-anchor="middle">第2年</text>
    <text x="930" y="725" text-anchor="middle">第3年</text>
    <text x="1290" y="725" text-anchor="middle">第5年</text>
  </g>

  <text x="745" y="780" text-anchor="middle" fill="#334155" font-family="Inter, 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="600">使用时间</text>
  <text x="0" y="0" text-anchor="middle" fill="#334155" font-family="Inter, 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="600" transform="translate(42 407) rotate(-90)">累计成本 (美元)</text>

  <polyline points="210,690 570,690 930,690 1290,690" fill="none" style="stroke:#005eeb;stroke-width:6;stroke-linecap:round;stroke-linejoin:round"/>
  <polyline points="210,584.4 570,478.8 930,373.2 1290,162.3" fill="none" style="stroke:#f9734f;stroke-width:6;stroke-linecap:round;stroke-linejoin:round"/>

  <g fill="#005eeb" stroke="#ffffff" stroke-width="4">
    <circle cx="210" cy="690" r="10"/>
    <circle cx="570" cy="690" r="10"/>
    <circle cx="930" cy="690" r="10"/>
    <circle cx="1290" cy="690" r="10"/>
  </g>
  <g fill="#f9734f" stroke="#ffffff" stroke-width="4">
    <circle cx="210" cy="584.4" r="10"/>
    <circle cx="570" cy="478.8" r="10"/>
    <circle cx="930" cy="373.2" r="10"/>
    <circle cx="1290" cy="162.3" r="10"/>
  </g>

  <g fill="#334155" font-family="Inter, 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="600" text-anchor="middle">
    <text x="210" y="562">$396</text>
    <text x="570" y="456">$792</text>
    <text x="930" y="350">$1,188</text>
    <text x="1290" y="139">$1,979</text>

    <text x="210" y="670">$0</text>
    <text x="570" y="670">$0</text>
    <text x="930" y="670">$0</text>
    <text x="1290" y="670">$0</text>
  </g>
</svg>
